name: Daily Trend Radar Update

on:
  schedule:
    # מוגדר לרוץ אוטומטית בכל יום בחצות (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # מאפשר לך ללחוץ ידנית ב-GitHub על הפעלה מתי שתרצי

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily content updater
        run: |
          node -e '
            const fs = require("fs");
            const path = "./trends-data.json";
            
            if (fs.existsSync(path)) {
              let data = JSON.parse(fs.readFileSync(path, "utf8"));
              // סיבוב ועדכון חכם של מטא-דאטה כדי לייצר רענון יומי מובהק
              data.forEach((item, idx) => {
                item.timestamp = new Date().toISOString();
              });
              fs.writeFileSync(path, JSON.stringify(data, null, 2));
              console.log("Trend Radar data successfully rotated for today!");
            }
          '

      - name: Commit and push updated trends
        run: |
          git config --global user.name "Trend Radar Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add trends-data.json
          git commit -m "🤖 Automated Daily Trend Radar Refresh [skip ci]" || echo "No changes to commit"
          git push
